<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="ciscoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bceb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="18" fill="url(#certBg)" stroke="url(#goldBorder)" stroke-width="2" />
  
  <!-- Subtle Inner Border -->
  <rect x="18" y="18" width="564" height="364" rx="12" fill="none" stroke="#2a3556" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Badge / Logo Header -->
  <g transform="translate(300, 75)">
    <circle cx="0" cy="0" r="38" fill="#132347" stroke="url(#ciscoGrad)" stroke-width="2" />
    <!-- Python Snake/Cisco Bridge Icon -->
    <path d="M-14 -12 C-14 -20, 2 -20, 8 -20 C14 -20, 14 -14, 14 -8 L14 2 L-4 2 C-10 2, -14 6, -14 12 Z" fill="#38bdf8" />
    <path d="M14 12 C14 20, -2 20, -8 20 C-14 20, -14 14, -14 8 L-14 -2 L4 -2 C10 -2, 14 -6, 14 -12 Z" fill="#fbbf24" />
    <circle cx="-6" cy="-12" r="2.5" fill="#0b1329" />
    <circle cx="6" cy="12" r="2.5" fill="#0b1329" />
  </g>

  <!-- Certificate Title -->
  <text x="300" y="145" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12" letter-spacing="3">CISCO NETWORKING ACADEMY</text>
  <text x="300" y="185" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="bold">Python Essentials</text>

  <!-- Divider line -->
  <line x1="200" y1="210" x2="400" y2="210" stroke="url(#ciscoGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Description -->
  <text x="300" y="245" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">Awarded for demonstrating proficiency in</text>
  <text x="300" y="270" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="600">Core Python Programming, Data Structures &amp; OOP</text>

  <!-- Footer Seal & Issuer -->
  <g transform="translate(60, 320)">
    <text x="0" y="15" fill="#64748b" font-family="sans-serif" font-size="11">ISSUER</text>
    <text x="0" y="32" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">Cisco Networking Academy</text>
  </g>

  <g transform="translate(540, 320)">
    <text x="0" y="15" text-anchor="end" fill="#64748b" font-family="sans-serif" font-size="11">STATUS</text>
    <text x="0" y="32" text-anchor="end" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">Verified Credential ✓</text>
  </g>
</svg>
