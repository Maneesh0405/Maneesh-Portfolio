<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gCloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="googleSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="33%" stop-color="#EA4335" />
      <stop offset="66%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#34A853" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="18" fill="url(#gCloudBg)" stroke="#334155" stroke-width="2" />
  <rect x="18" y="18" width="564" height="364" rx="12" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Badge Header -->
  <g transform="translate(300, 75)">
    <circle cx="0" cy="0" r="38" fill="#1e293b" stroke="url(#googleSparkle)" stroke-width="2.5" />
    <!-- Google Cloud Sparkle / Cloud Icon -->
    <path d="M-12 -2 C-16 -8, -6 -16, 2 -14 C6 -20, 16 -18, 18 -10 C24 -10, 24 -2, 20 2 C22 6, 20 12, 14 12 L-10 12 C-16 12, -18 4, -12 -2 Z" fill="#4285F4" />
    <path d="M-2 2 L4 12 L-8 12 Z" fill="#34A853" />
    <circle cx="10" cy="-6" r="4" fill="#FBBC05" />
    <circle cx="-6" cy="-4" r="3" fill="#EA4335" />
  </g>

  <!-- Certificate Title -->
  <text x="300" y="145" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12" letter-spacing="3">GOOGLE CLOUD</text>
  <text x="300" y="185" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="bold">Generative AI</text>

  <!-- Divider -->
  <line x1="200" y1="210" x2="400" y2="210" stroke="url(#googleSparkle)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Description -->
  <text x="300" y="245" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">Recognized for foundational understanding in</text>
  <text x="300" y="270" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="15" font-weight="600">Generative AI Models, Vertex AI &amp; Transformer Architecture</text>

  <!-- Footer -->
  <g transform="translate(60, 320)">
    <text x="0" y="15" fill="#64748b" font-family="sans-serif" font-size="11">ORGANIZATION</text>
    <text x="0" y="32" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Google Cloud</text>
  </g>

  <g transform="translate(540, 320)">
    <text x="0" y="15" text-anchor="end" fill="#64748b" font-family="sans-serif" font-size="11">COMPLETED</text>
    <text x="0" y="32" text-anchor="end" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="bold">Year 2026 ✓</text>
  </g>
</svg>
