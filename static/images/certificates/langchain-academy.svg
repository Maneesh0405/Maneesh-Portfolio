<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f28" />
      <stop offset="100%" stop-color="#241442" />
    </linearGradient>
    <linearGradient id="langGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="violetBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="18" fill="url(#langBg)" stroke="url(#violetBorder)" stroke-width="2" />
  <rect x="18" y="18" width="564" height="364" rx="12" fill="none" stroke="#3b2b5c" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Badge Header -->
  <g transform="translate(300, 75)">
    <circle cx="0" cy="0" r="38" fill="#20153d" stroke="url(#langGrad)" stroke-width="2" />
    <text x="0" y="12" text-anchor="middle" font-size="28">🦜🔗</text>
  </g>

  <!-- Certificate Title -->
  <text x="300" y="145" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="12" letter-spacing="3">LANGCHAIN ACADEMY</text>
  <text x="300" y="185" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="bold">LangChain Certification</text>

  <!-- Divider -->
  <line x1="200" y1="210" x2="400" y2="210" stroke="url(#langGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Description -->
  <text x="300" y="245" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">Demonstrated expertise in building with</text>
  <text x="300" y="270" text-anchor="middle" fill="#ec4899" font-family="sans-serif" font-size="15" font-weight="600">LLMs, Prompt Engineering, Memory &amp; RAG Agents</text>

  <!-- Footer -->
  <g transform="translate(60, 320)">
    <text x="0" y="15" fill="#94a3b8" font-family="sans-serif" font-size="11">ISSUER</text>
    <text x="0" y="32" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">LangChain Academy</text>
  </g>

  <g transform="translate(540, 320)">
    <text x="0" y="15" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="11">COMPLETED</text>
    <text x="0" y="32" text-anchor="end" fill="#a855f7" font-family="sans-serif" font-size="13" font-weight="bold">Year 2026 ✓</text>
  </g>
</svg>
