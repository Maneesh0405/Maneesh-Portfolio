<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="450" fill="#0B1120"/>

  <!-- Grid lines -->
  <g stroke="#1E293B" stroke-width="0.75" opacity="0.6">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Software Dashboard Window -->
  <rect x="40" y="30" width="720" height="390" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="40" rx="10" fill="#162032"/>
  <circle cx="65" cy="50" r="4.5" fill="#EF4444"/>
  <circle cx="82" cy="50" r="4.5" fill="#F59E0B"/>
  <circle cx="99" cy="50" r="4.5" fill="#10B981"/>
  <text x="400" y="55" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">LifeOS AI — LangChain Autonomous Executive Agent</text>

  <!-- Left: LangGraph Agent Node Architecture -->
  <rect x="65" y="90" width="300" height="305" rx="8" fill="#0B1120" stroke="#1F2937" stroke-width="1"/>
  <text x="85" y="120" fill="#F9FAFB" font-family="'Poppins', sans-serif" font-size="14" font-weight="700">LangChain Agent Graph</text>

  <!-- Node 1: Input -->
  <rect x="85" y="140" width="260" height="36" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="100" y="162" fill="#F9FAFB" font-family="'Inter', sans-serif" font-size="11">Input: Query &amp; Synthesize Calendar</text>

  <line x1="215" y1="176" x2="215" y2="198" stroke="#3B82F6" stroke-width="2"/>

  <!-- Node 2: LLM Router -->
  <rect x="85" y="198" width="260" height="36" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="100" y="220" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="11">LLM Tool Selector &amp; Decision Plan</text>

  <line x1="145" y1="234" x2="145" y2="256" stroke="#3B82F6" stroke-width="2"/>
  <line x1="285" y1="234" x2="285" y2="256" stroke="#3B82F6" stroke-width="2"/>

  <!-- Sub Tools -->
  <rect x="85" y="256" width="120" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="145" y="277" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Google Cal Tool</text>

  <rect x="225" y="256" width="120" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="285" y="277" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">RAG Memory</text>

  <rect x="85" y="310" width="260" height="36" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="215" y="332" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓ Context &amp; Output Synthesized</text>

  <!-- Right: Agent Execution Console Stream -->
  <rect x="380" y="90" width="355" height="305" rx="8" fill="#0B1120" stroke="#1F2937" stroke-width="1"/>
  <text x="400" y="120" fill="#F9FAFB" font-family="'Poppins', sans-serif" font-size="14" font-weight="700">Autonomous Execution Stream</text>

  <rect x="400" y="140" width="315" height="52" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="415" y="160" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Thought:</text>
  <text x="415" y="178" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11">Searching vector database for project requirements.</text>

  <rect x="400" y="202" width="315" height="52" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="415" y="222" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Action: vector_store_similarity_search()</text>
  <text x="415" y="240" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11">Found 4 relevant context chunks from docs.</text>

  <rect x="400" y="264" width="315" height="105" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
  <text x="415" y="284" fill="#3B82F6" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Synthesized Agent Response:</text>
  <text x="415" y="304" fill="#F9FAFB" font-family="'Inter', sans-serif" font-size="11">Meeting scheduled for tomorrow at 3:00 PM.</text>
  <text x="415" y="324" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11">Technical briefing memo generated from vector</text>
  <text x="415" y="342" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11">knowledge base and emailed to stakeholders.</text>
</svg>
