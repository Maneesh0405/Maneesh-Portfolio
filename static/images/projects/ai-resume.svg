<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="450" fill="#0B1120"/>

  <!-- Subtle Blueprint Grid lines -->
  <g stroke="#1E293B" stroke-width="0.75" opacity="0.6">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Software Dashboard Application Window -->
  <rect x="40" y="30" width="720" height="390" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>
  
  <!-- Window Title Bar -->
  <rect x="40" y="30" width="720" height="40" rx="10" fill="#162032"/>
  <circle cx="65" cy="50" r="4.5" fill="#EF4444"/>
  <circle cx="82" cy="50" r="4.5" fill="#F59E0B"/>
  <circle cx="99" cy="50" r="4.5" fill="#10B981"/>
  <text x="400" y="55" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">AI Resume Analyzer &amp; ATS Match Engine — v2.4</text>

  <!-- Left Column: Resume Parsing & Extracted Entities -->
  <rect x="65" y="90" width="315" height="305" rx="8" fill="#0B1120" stroke="#1F2937" stroke-width="1"/>
  <text x="85" y="120" fill="#F9FAFB" font-family="'Poppins', sans-serif" font-size="14" font-weight="700">Uploaded Document &amp; NLP Entities</text>
  
  <!-- File Chip -->
  <rect x="85" y="135" width="275" height="34" rx="6" fill="#1E293B"/>
  <text x="100" y="157" fill="#3B82F6" font-family="'Inter', sans-serif" font-size="11" font-weight="600">📄 Maneesh_Resume.pdf (Parsed 100%)</text>

  <!-- Extracted Skills Matrix -->
  <text x="85" y="195" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Identified Competencies:</text>
  
  <rect x="85" y="210" width="80" height="26" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="125" y="227" fill="#F9FAFB" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Python</text>

  <rect x="175" y="210" width="90" height="26" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="220" y="227" fill="#F9FAFB" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Machine Learning</text>

  <rect x="275" y="210" width="85" height="26" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="317" y="227" fill="#F9FAFB" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">LangChain</text>

  <rect x="85" y="246" width="65" height="26" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="117" y="263" fill="#F9FAFB" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">spaCy</text>

  <rect x="160" y="246" width="75" height="26" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="197" y="263" fill="#F9FAFB" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Flask API</text>

  <rect x="245" y="246" width="115" height="26" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="302" y="263" fill="#F9FAFB" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Cosine Similarity</text>

  <!-- Similarity Vector Breakdown -->
  <rect x="85" y="290" width="275" height="85" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="100" y="312" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11">Target Role: AI / Software Engineer</text>
  <text x="100" y="332" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11">Experience Vector Weight: 94.2%</text>
  <text x="100" y="352" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="600">✓ Keyword Density Optimal (0.88)</text>

  <!-- Right Column: ATS Score Gauge & Job Fit -->
  <rect x="400" y="90" width="335" height="305" rx="8" fill="#0B1120" stroke="#1F2937" stroke-width="1"/>
  <text x="420" y="120" fill="#F9FAFB" font-family="'Poppins', sans-serif" font-size="14" font-weight="700">ATS Match Analysis Score</text>

  <!-- Circular Metric Arc / Radial Progress -->
  <circle cx="567" cy="200" r="55" fill="none" stroke="#1E293B" stroke-width="12"/>
  <circle cx="567" cy="200" r="55" fill="none" stroke="#3B82F6" stroke-width="12" stroke-dasharray="345" stroke-dashoffset="40" stroke-linecap="round"/>
  <text x="567" y="196" fill="#F9FAFB" font-family="'Poppins', sans-serif" font-size="24" font-weight="800" text-anchor="middle">92%</text>
  <text x="567" y="214" fill="#3B82F6" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">HIGH MATCH</text>

  <!-- Key Recommendations -->
  <rect x="420" y="280" width="295" height="95" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="435" y="304" fill="#F9FAFB" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Actionable NLP Recommendations:</text>
  <text x="435" y="326" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11">• Add quantification for ML model latency reductions</text>
  <text x="435" y="346" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11">• Emphasize PyTorch &amp; LangChain agent deployments</text>
  <text x="435" y="364" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="600">✓ Ready for Recruiter &amp; ATS Submission</text>
</svg>
