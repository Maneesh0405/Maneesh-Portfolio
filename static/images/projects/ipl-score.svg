<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="450" fill="#0B1120"/>

  <!-- Grid lines -->
  <g stroke="#1E293B" stroke-width="0.75" opacity="0.6">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Software Dashboard Application Window -->
  <rect x="40" y="30" width="720" height="390" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="40" rx="10" fill="#162032"/>
  <circle cx="65" cy="50" r="4.5" fill="#EF4444"/>
  <circle cx="82" cy="50" r="4.5" fill="#F59E0B"/>
  <circle cx="99" cy="50" r="4.5" fill="#10B981"/>
  <text x="400" y="55" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">IPL First-Innings Score Predictor — Machine Learning Pipeline</text>

  <!-- Left: Match State & Regression Features -->
  <rect x="65" y="90" width="315" height="305" rx="8" fill="#0B1120" stroke="#1F2937" stroke-width="1"/>
  <text x="85" y="120" fill="#F9FAFB" font-family="'Poppins', sans-serif" font-size="14" font-weight="700">Live Feature Inputs</text>

  <!-- Feature inputs -->
  <rect x="85" y="135" width="275" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="100" y="157" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11">Batting: <tspan fill="#F9FAFB" font-weight="600">Mumbai Indians (Wankhede)</tspan></text>

  <rect x="85" y="177" width="275" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="100" y="199" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11">Bowling: <tspan fill="#F9FAFB" font-weight="600">Chennai Super Kings</tspan></text>

  <rect x="85" y="219" width="275" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="100" y="241" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11">Current: <tspan fill="#F9FAFB" font-weight="600">142/3 in 15.2 Overs (CRR: 9.26)</tspan></text>

  <rect x="85" y="261" width="275" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="100" y="283" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11">Last 5 Overs: <tspan fill="#F9FAFB" font-weight="600">48 Runs / 1 Wicket</tspan></text>

  <!-- Result Banner -->
  <rect x="85" y="310" width="275" height="65" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="222" y="333" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Ridge Regression Forecast:</text>
  <text x="222" y="360" fill="#3B82F6" font-family="'Poppins', sans-serif" font-size="20" font-weight="800" text-anchor="middle">196 – 208 Runs</text>

  <!-- Right: Over-by-Over Trajectory Chart -->
  <rect x="400" y="90" width="335" height="305" rx="8" fill="#0B1120" stroke="#1F2937" stroke-width="1"/>
  <text x="420" y="120" fill="#F9FAFB" font-family="'Poppins', sans-serif" font-size="14" font-weight="700">Projected Run Curve vs Actuals</text>

  <!-- Chart axes -->
  <line x1="435" y1="330" x2="705" y2="330" stroke="#334155" stroke-width="1"/>
  <line x1="435" y1="150" x2="435" y2="330" stroke="#334155" stroke-width="1"/>

  <!-- Bar Series (Historical Overs) -->
  <rect x="450" y="270" width="18" height="60" fill="#3B82F6" opacity="0.4" rx="2"/>
  <rect x="480" y="245" width="18" height="85" fill="#3B82F6" opacity="0.5" rx="2"/>
  <rect x="510" y="220" width="18" height="110" fill="#3B82F6" opacity="0.6" rx="2"/>
  <rect x="540" y="195" width="18" height="135" fill="#3B82F6" opacity="0.75" rx="2"/>
  <rect x="570" y="210" width="18" height="120" fill="#3B82F6" opacity="0.65" rx="2"/>
  <rect x="600" y="170" width="18" height="160" fill="#3B82F6" opacity="0.85" rx="2"/>
  <rect x="630" y="150" width="18" height="180" fill="#3B82F6" rx="2"/>

  <!-- Regression Forecast Line -->
  <path d="M450 280 Q 550 230 670 145" fill="none" stroke="#60A5FA" stroke-width="3"/>
  <circle cx="670" cy="145" r="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <text x="670" y="130" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">202 Projected</text>

  <text x="440" y="355" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10">Overs 1-5</text>
  <text x="535" y="355" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10">Overs 6-15</text>
  <text x="630" y="355" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10">Death Overs (16-20)</text>
</svg>
